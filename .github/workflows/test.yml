name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven)
    runs-on: [self-hosted, fototimeline-build]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # I test usano un MongoDB embedded: il binario si scarica una volta e resta in cache.
      - uses: actions/cache@v4
        with:
          path: ~/.embedmongo
          key: embedmongo-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
      # ImageMagick e ffmpeg per i test delle foto che Java non legge (JpegDifficiliTest,
      # FileRovinatiTest): senza, quei test si saltano (assumeTrue). Sul runner vanno installati una
      # volta (sudo apt-get install -y imagemagick ffmpeg); qui si prova solo se sudo non chiede la
      # password, altrimenti un avviso nel riepilogo del job.
      - name: ImageMagick e ffmpeg per i test
        run: |
          mancanti=""
          command -v magick >/dev/null 2>&1 || command -v convert >/dev/null 2>&1 || mancanti="$mancanti imagemagick"
          command -v ffmpeg >/dev/null 2>&1 || mancanti="$mancanti ffmpeg"
          if [ -z "$mancanti" ]; then
            (magick -version 2>/dev/null || convert -version) | head -1
          elif sudo -n true 2>/dev/null; then
            sudo -n apt-get update -q && sudo -n apt-get install -y -q --no-install-recommends $mancanti
          else
            echo "::warning::Sul runner mancano:$mancanti. I test che li usano si saltano: sudo apt-get install -y$mancanti"
          fi
      - run: ./mvnw -B verify
      - name: Report dei test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend (build Angular)
    runs-on: [self-hosted, fototimeline-build]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  visione:
    name: Visione (pytest)
    runs-on: [self-hosted, fototimeline-build]
    defaults:
      run:
        working-directory: visione
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Senza torch né modello: i test usano un modello finto.
      - run: python -m venv .venv && .venv/bin/pip install -q -r requirements-test.txt
      - run: .venv/bin/python -m pytest -q
