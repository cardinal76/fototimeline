server:
  port: 8080
  # Senza login l'app deve restare su questo PC: con un altro indirizzo e il
  # login spento non parte (ConfigurazioneSicurezza).
  address: ${FOTOTIMELINE_INDIRIZZO:127.0.0.1}

spring:
  application:
    name: fototimeline
  autoconfigure:
    # Niente utente "user" con password generata: il login è Keycloak o niente.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/fototimeline}
      auto-index-creation: true
  http:
    client:
      # Le chiamate a rclone (montare può richiedere qualche secondo).
      connect-timeout: 5s
      read-timeout: 60s
  servlet:
    multipart:
      # I video del telefono possono pesare gigabyte: vanno su disco, non in memoria.
      max-file-size: 8GB
      max-request-size: 8GB
      file-size-threshold: 1MB

fototimeline:
  # Dove finiscono gli originali (AAAA/MM/GG/nome). Sul server è una cartella
  # di pCloud (o simile) montata con rclone.
  archivio: ${FOTOTIMELINE_ARCHIVIO:${user.home}/FotoTimeline}
  # Miniature: vuoto = <archivio>/.miniature. Sul server stanno sul disco
  # locale, perché leggerle dal cloud renderebbe lenta la timeline.
  miniature: ${FOTOTIMELINE_MINIATURE:}
  miniatura-lato: 480
  # "Importa cartella" accetta solo cartelle sotto questa; vuoto = qualunque
  # (va bene solo sul PC).
  importazione: ${FOTOTIMELINE_IMPORTAZIONE:}
  # Programmi per HEIC e video (nel container ci sono; sul PC servono installati).
  media:
    heif-convert: ${FOTOTIMELINE_HEIF_CONVERT:heif-convert}
    ffmpeg: ${FOTOTIMELINE_FFMPEG:ffmpeg}
    ffprobe: ${FOTOTIMELINE_FFPROBE:ffprobe}
  # Versione compatibile (H.264/AAC in MP4) dei video che non tutti i browser
  # riproducono (HEVC dell'iPhone, VP9, ProRes): una alla volta, in sottofondo,
  # con ffmpeg a priorità bassa (nice -n 19).
  video:
    attiva: ${FOTOTIMELINE_VIDEO_ATTIVA:true}
    # Lato corto massimo: 1080 = i 4K scendono a 1080p, i più piccoli restano come sono.
    risoluzione-massima: ${FOTOTIMELINE_VIDEO_RISOLUZIONE:1080}
    # Thread di ffmpeg: quanta CPU può prendere una conversione.
    thread: ${FOTOTIMELINE_VIDEO_THREAD:2}
    # Dove vanno i convertiti; vuoto = <archivio>/.compatibili, accanto agli
    # originali (nel cloud sul server: pesano come video, non come miniature).
    destinazione: ${FOTOTIMELINE_VIDEO_DESTINAZIONE:}
    # Ogni quanto la coda guarda se può ripartire (per esempio cloud rimontato).
    controllo: PT1M
  # Copia dei metadati (MongoDB) accanto alle foto: <archivio>/.backup.
  backup:
    cartella: ${FOTOTIMELINE_BACKUP_CARTELLA:}
    intervallo: ${FOTOTIMELINE_BACKUP_INTERVALLO:P1D}
    tenere: ${FOTOTIMELINE_BACKUP_TENERE:30}
  # Cartella svuotata da sola nell'archivio (le foto si spostano), per esempio
  # quella dove il telefono carica nel cloud. Vuota = spenta.
  importazione-automatica:
    cartella: ${FOTOTIMELINE_CARTELLA_AUTOMATICA:}
    intervallo: ${FOTOTIMELINE_INTERVALLO_AUTOMATICO:PT15M}
  # Foto nuove dai telefoni (pCloud) nella cartella automatica (i telefoni si
  # aggiungono nell'app, da admin): ogni quanto controllare se è ora di un giro.
  telefono:
    controllo: PT5M
    # A chi dare il telefono migrato da quando era uno solo (username Keycloak);
    # vuoto = al primo amministratore che entra.
    proprietario: ${FOTOTIMELINE_TELEFONO_PROPRIETARIO:}
  # Il nome del luogo dal GPS, offline: i file di GeoNames (CC BY 4.0) in
  # questa cartella (cities500.txt, admin1CodesASCII.txt, ...; nel container
  # li scarica il Dockerfile in /app/geonames). Vuota = niente luoghi.
  luoghi:
    cartella: ${FOTOTIMELINE_LUOGHI:}
    # Più lontano di così dal centro abitato più vicino: luogo sconosciuto (mare aperto).
    distanza-massima-km: ${FOTOTIMELINE_LUOGHI_DISTANZA:30}
  # Link pubblici alle foto (/c/<token>): freno per indirizzo IP sui path
  # pubblici, contro chi prova token a caso.
  condivisioni:
    richieste-al-minuto: 1200
    token-sbagliati: 20
    finestra-token-sbagliati: PT15M
    massimo-foto: 2000
    lato-vista: 2048
  # Foto quasi uguali: bit di differenza massimi tra le impronte (pHash a 64
  # bit), e una soglia più larga per le raffiche (data EXIF a pochi secondi).
  quasi-uguali:
    soglia: ${FOTOTIMELINE_QUASI_UGUALI_SOGLIA:6}
    finestra-raffica: PT10S
    soglia-raffica: 12
  # Avvisi su Telegram quando una voce della pagina "Salute" cambia stato.
  # Token del bot (BotFather) e chat id: vuoti = avvisi spenti, la pagina c'è lo stesso.
  telegram:
    token: ${FOTOTIMELINE_TELEGRAM_TOKEN:}
    chat: ${FOTOTIMELINE_TELEGRAM_CHAT:}
    # Anche quando una voce diventa gialla (per esempio il cloud smontato).
    avvisa-attenzione: ${FOTOTIMELINE_TELEGRAM_ATTENZIONE:false}
    controllo: ${FOTOTIMELINE_TELEGRAM_CONTROLLO:PT15M}
    # Il link all'app nei messaggi; vuoto = senza link.
    indirizzo-app: ${FOTOTIMELINE_DOMINIO:}
  # "Accadde oggi" su Telegram: ogni mattina le foto di oggi negli anni passati,
  # nella chat degli avvisi o in una a parte. Attivo, ora, foto e "Nessun ricordo
  # oggi" sono i valori iniziali: si cambiano dall'app (Salute → Ricordi su Telegram).
  ricordi-telegram:
    attivo: ${FOTOTIMELINE_RICORDI_ATTIVO:true}
    ora: ${FOTOTIMELINE_RICORDI_ORA:08:00}
    foto: ${FOTOTIMELINE_RICORDI_FOTO:6}
    # Vuota = la chat degli avvisi (FOTOTIMELINE_TELEGRAM_CHAT).
    chat: ${FOTOTIMELINE_RICORDI_CHAT:}
    fuso: ${FOTOTIMELINE_RICORDI_FUSO:Europe/Rome}
    nessun-ricordo: ${FOTOTIMELINE_RICORDI_NESSUNO:false}
    # Ogni quanto guardare se è ora (e recuperare se all'ora giusta l'app era giù).
    controllo: PT5M
  # "Importa da Google Takeout" (solo sul server, con rclone): gli zip che Takeout
  # mette su Google Drive. La sorgente è il valore iniziale, poi si cambia dall'app.
  takeout:
    sorgente: ${FOTOTIMELINE_TAKEOUT_SORGENTE:gdrive:Takeout}
    # Dove si scarica uno zip alla volta, sul disco del server (vista dall'app e da rclone).
    cartella: ${FOTOTIMELINE_TAKEOUT_CARTELLA:${java.io.tmpdir}/fototimeline-takeout}
    cartella-rclone: ${FOTOTIMELINE_TAKEOUT_CARTELLA_RCLONE:}
    # Spazio da lasciare libero oltre allo zip: se non c'è, l'importazione si ferma e lo dice.
    riserva: ${FOTOTIMELINE_TAKEOUT_RISERVA:2GB}
    attesa-cloud: PT1M
    controllo: PT6H
  # "Scegli da Google Foto" (Google Photos Picker API): client OAuth di un progetto
  # Google Cloud (GUIDA.md). Vuoti = la funzione non si vede. Mai nei log.
  google:
    client-id: ${FOTOTIMELINE_GOOGLE_CLIENT_ID:}
    client-secret: ${FOTOTIMELINE_GOOGLE_CLIENT_SECRET:}
    # Per cifrare i refresh token in MongoDB (AES-GCM); vuota = derivata dal client secret.
    chiave: ${FOTOTIMELINE_GOOGLE_CHIAVE:}
    # Vuoto = <indirizzo dell'app>/api/google/callback (dietro Caddy: https://<dominio>/...).
    redirect-uri: ${FOTOTIMELINE_GOOGLE_REDIRECT:}
  login:
    attivo: ${FOTOTIMELINE_LOGIN:false}
    # Ruolo di realm richiesto; vuoto = basta un utente del realm.
    ruolo: ${FOTOTIMELINE_RUOLO:}
    # Ruolo di realm per montare e smontare il cloud.
    ruolo-admin: ${FOTOTIMELINE_RUOLO_ADMIN:fototimeline-admin}
  # Il cloud montato dal container rclone (deploy/docker-compose.yml). Vuoto
  # sul PC: l'archivio è un disco sempre disponibile.
  cloud:
    rc-url: ${RCLONE_RC_URL:}
    rc-utente: ${RCLONE_RC_UTENTE:fototimeline}
    rc-password: ${RCLONE_RC_PASSWORD:}
    remoto: ${RCLONE_REMOTO:lifetime:}
    punto-montaggio: ${RCLONE_PUNTO_MONTAGGIO:/cloud}
    # false: dopo ogni riavvio resta smontato finché un admin non lo monta.
    monta-all-avvio: ${RCLONE_MONTA_ALL_AVVIO:false}
