<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FotoTimeline · senza rete</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
           font-family: system-ui, sans-serif; background: #0f1115; color: #e8eaee; padding: 1rem; }
    img { width: 72px; height: 72px; }
    p { color: #9aa0ab; }
    button { font: inherit; padding: 0.5rem 1rem; border-radius: 8px; border: 0; background: #4f8cff; color: #fff; }
  </style>
</head>
<body>
  <div>
    <img src="/icone/icona-192.png" alt="">
    <h1>Sei senza rete</h1>
    <p>FotoTimeline ha bisogno della connessione per mostrare le foto.</p>
    <button type="button" onclick="location.reload()">Riprova</button>
  </div>
</body>
</html>
