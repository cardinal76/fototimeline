# Tema del login di FotoTimeline per il Keycloak di presenze, realm "fototimeline"
# (DEPLOY.md, "Tema del login su Keycloak"). Eredita il tema "keycloak" (quello
# classico, con i suoi template e le sue traduzioni) e cambia solo colori e logo,
# gli stessi dell'app: chiaro o scuro come il telefono.
parent=keycloak
import=common/keycloak
# login.css e tile.css sono del tema padre: si tengono, il nostro va dopo.
styles=css/login.css css/tile.css css/fototimeline.css
locales=it,en
