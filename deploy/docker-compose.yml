# FotoTimeline su server2. Lo lancia .github/workflows/rilascio.yml:
#   docker compose -p fototimeline -f deploy/docker-compose.yml --env-file ~/fototimeline/.env up -d --build
#
#   internet ─▶ caddy (HTTPS) ─▶ app ─┬─▶ mongo
#                                     ├─▶ rclone (API rc) ─▶ LifetimeCloud via WebDAV
#                                     └─▶ visione (CLIP e volti: ricerca per contenuto, persone, indici dei vettori)
#
# Le foto stanno nel cloud: il container rclone lo monta in $FOTOTIMELINE_DATI/cloud
# quando un amministratore preme "Monta" nell'app, e lo smonta con "Smonta".
# Solo rclone ha i permessi FUSE e il token del cloud; l'app no.

name: fototimeline

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Poca cache: server2 fa anche le build di presenze e TrovaCampo.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?}
    volumes:
      - mongo:/data/db

  rclone:
    image: rclone/rclone:1.68
    restart: unless-stopped
    # Solo l'API di controllo: il montaggio lo chiede l'app (mount/mount, mount/unmount),
    # con le opzioni di cache e permessi (Cloud.opzioniVfs).
    command:
      - rcd
      - --rc-addr=:5572
      - --config=/config/rclone/rclone.conf
      - --cache-dir=/cache
    environment:
      RCLONE_RC_USER: fototimeline
      RCLONE_RC_PASS: ${RCLONE_RC_PASSWORD:?}
    # FUSE: serve per montare. È il motivo per cui rclone sta in un container suo.
    cap_add: [SYS_ADMIN]
    devices: ["/dev/fuse:/dev/fuse"]
    security_opt: ["apparmor:unconfined"]
    stop_grace_period: 30s
    volumes:
      - ${FOTOTIMELINE_DATI:?}/rclone:/config/rclone:ro
      - rclone-cache:/cache
      # Google Takeout: rclone ci scarica uno zip alla volta, l'app lo apre (stesso percorso nei due container).
      - ${FOTOTIMELINE_DATI:?}/takeout:/takeout
      # Video del telefono troppo grandi per LifetimeCloud: rclone ci scarica l'originale, l'app lo ricomprime.
      - ${FOTOTIMELINE_DATI:?}/video-grandi:/video-grandi
      # rshared: il montaggio fatto qui dentro si vede sull'host e quindi nell'app.
      - type: bind
        source: ${FOTOTIMELINE_DATI:?}/cloud
        target: /cloud
        bind:
          propagation: rshared

  app:
    build:
      context: ..
    restart: unless-stopped
    # visione no: senza, l'app parte lo stesso e la ricerca per contenuto risponde 502.
    depends_on: [mongo, rclone]
    environment:
      SPRING_PROFILES_ACTIVE: server
      # I video salvano l'ora in UTC: si converte in quella italiana, come l'EXIF delle foto.
      TZ: Europe/Rome
      # Heap della JVM e, al primo OutOfMemoryError, un heap dump in /diagnostica (DEPLOY.md, "Memoria").
      # 1,5 GB di heap nei 3 GB del container: il resto è la JVM fuori dall'heap e i processi figli
      # (ffmpeg della conversione e della ricompressione, heif-convert), che contano nella memoria del container.
      JAVA_TOOL_OPTIONS: "${FOTOTIMELINE_JAVA_OPTS:--Xmx1536m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/diagnostica}"
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/fototimeline?authSource=admin
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-https://presenze.footballer.it/auth/realms/fototimeline}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?}
      FOTOTIMELINE_ARCHIVIO: /cloud/FotoTimeline
      FOTOTIMELINE_MINIATURE: /miniature
      FOTOTIMELINE_IMPORTAZIONE: /cloud
      FOTOTIMELINE_BACKUP_INTERVALLO: ${FOTOTIMELINE_BACKUP_INTERVALLO:-P1D}
      FOTOTIMELINE_BACKUP_TENERE: ${FOTOTIMELINE_BACKUP_TENERE:-30}
      # Giorni nel cestino prima che una foto eliminata se ne vada per sempre (0 = mai).
      FOTOTIMELINE_CESTINO_GIORNI: ${FOTOTIMELINE_CESTINO_GIORNI:-30}
      # Vuota = spenta. Per esempio /cloud/Da importare: ci carica il telefono.
      FOTOTIMELINE_CARTELLA_AUTOMATICA: ${FOTOTIMELINE_CARTELLA_AUTOMATICA:-}
      FOTOTIMELINE_INTERVALLO_AUTOMATICO: ${FOTOTIMELINE_INTERVALLO_AUTOMATICO:-PT15M}
      # "Indicizza archivio", "Importa cartella" e cartella automatica: file letti insieme dal cloud.
      FOTOTIMELINE_INDICIZZA_PARALLELI: ${FOTOTIMELINE_INDICIZZA_PARALLELI:-3}
      # Un file che non risponde (lettura dal mount appesa) si abbandona dopo così, più il tempo per GB.
      FOTOTIMELINE_TEMPO_MASSIMO_FILE: ${FOTOTIMELINE_TEMPO_MASSIMO_FILE:-PT5M}
      FOTOTIMELINE_TEMPO_MASSIMO_PER_GB: ${FOTOTIMELINE_TEMPO_MASSIMO_PER_GB:-PT5M}
      # Dopo Annulla, quanto si aspettano i file già cominciati prima di abbandonarli.
      FOTOTIMELINE_ATTESA_ANNULLAMENTO: ${FOTOTIMELINE_ATTESA_ANNULLAMENTO:-PT1M}
      # Di chi è il telefono di quando era uno solo; vuoto = del primo admin che entra.
      FOTOTIMELINE_TELEFONO_PROPRIETARIO: ${FOTOTIMELINE_TELEFONO_PROPRIETARIO:-}
      # Versione compatibile (H.264) dei video HEVC: thread di ffmpeg e lato corto massimo.
      FOTOTIMELINE_VIDEO_ATTIVA: ${FOTOTIMELINE_VIDEO_ATTIVA:-true}
      FOTOTIMELINE_VIDEO_THREAD: ${FOTOTIMELINE_VIDEO_THREAD:-2}
      FOTOTIMELINE_VIDEO_RISOLUZIONE: ${FOTOTIMELINE_VIDEO_RISOLUZIONE:-1080}
      # Video del telefono troppo grandi per LifetimeCloud (oltre 20480 MB, o 413): ricompressi in H.265 qui,
      # un video alla volta, originale scaricato in /video-grandi (disco di server2) e poi spostato su pCloud
      # nella cartella FOTOTIMELINE_VIDEO_GRANDI_PCLOUD (DEPLOY.md, "Video troppo grandi").
      FOTOTIMELINE_VIDEO_GRANDI_ATTIVA: ${FOTOTIMELINE_VIDEO_GRANDI_ATTIVA:-true}
      FOTOTIMELINE_VIDEO_MAX_MB: ${FOTOTIMELINE_VIDEO_MAX_MB:-20000}
      FOTOTIMELINE_VIDEO_GRANDI_PCLOUD: ${FOTOTIMELINE_VIDEO_GRANDI_PCLOUD:-Video originali troppo grandi}
      FOTOTIMELINE_VIDEO_GRANDI_CARTELLA: /video-grandi
      FOTOTIMELINE_VIDEO_GRANDI_RISERVA: ${FOTOTIMELINE_VIDEO_GRANDI_RISERVA:-2GB}
      FOTOTIMELINE_VIDEO_GRANDI_THREAD: ${FOTOTIMELINE_VIDEO_GRANDI_THREAD:-2}
      FOTOTIMELINE_VIDEO_GRANDI_CRF: ${FOTOTIMELINE_VIDEO_GRANDI_CRF:-24}
      FOTOTIMELINE_VIDEO_GRANDI_CRF_MASSIMO: ${FOTOTIMELINE_VIDEO_GRANDI_CRF_MASSIMO:-32}
      FOTOTIMELINE_VIDEO_GRANDI_X265: ${FOTOTIMELINE_VIDEO_GRANDI_X265:-frame-threads=1:rc-lookahead=5:bframes=2:ref=2:lookahead-slices=0}
      # Quanta memoria può prendere ffmpeg (x265) nel tetto del container: con 3g di tetto, un 4K a 8 bit.
      FOTOTIMELINE_VIDEO_GRANDI_MEMORIA: ${FOTOTIMELINE_VIDEO_GRANDI_MEMORIA:-1100MB}
      RCLONE_RC_URL: http://rclone:5572
      RCLONE_RC_PASSWORD: ${RCLONE_RC_PASSWORD:?}
      RCLONE_REMOTO: ${RCLONE_REMOTO:-lifetime:}
      RCLONE_PUNTO_MONTAGGIO: /cloud
      RCLONE_MONTA_ALL_AVVIO: ${RCLONE_MONTA_ALL_AVVIO:-false}
      # Avvisi su Telegram ai cambi della pagina "Salute"; vuoti = spenti. Il dominio fa il link nei messaggi.
      FOTOTIMELINE_TELEGRAM_TOKEN: ${FOTOTIMELINE_TELEGRAM_TOKEN:-}
      FOTOTIMELINE_TELEGRAM_CHAT: ${FOTOTIMELINE_TELEGRAM_CHAT:-}
      FOTOTIMELINE_TELEGRAM_ATTENZIONE: ${FOTOTIMELINE_TELEGRAM_ATTENZIONE:-false}
      # "Accadde oggi" su Telegram ogni mattina: valori di partenza, poi dall'app. Chat vuota = quella degli avvisi.
      FOTOTIMELINE_RICORDI_ATTIVO: ${FOTOTIMELINE_RICORDI_ATTIVO:-true}
      FOTOTIMELINE_RICORDI_ORA: ${FOTOTIMELINE_RICORDI_ORA:-08:00}
      FOTOTIMELINE_RICORDI_FOTO: ${FOTOTIMELINE_RICORDI_FOTO:-6}
      FOTOTIMELINE_RICORDI_CHAT: ${FOTOTIMELINE_RICORDI_CHAT:-}
      FOTOTIMELINE_RICORDI_NESSUNO: ${FOTOTIMELINE_RICORDI_NESSUNO:-false}
      FOTOTIMELINE_DOMINIO: ${FOTOTIMELINE_DOMINIO:?}
      # "Importa da Google Takeout": dove sono gli zip (valore iniziale, poi dall'app) e quanto spazio lasciare.
      FOTOTIMELINE_TAKEOUT_SORGENTE: ${FOTOTIMELINE_TAKEOUT_SORGENTE:-gdrive:Takeout}
      FOTOTIMELINE_TAKEOUT_CARTELLA: /takeout
      FOTOTIMELINE_TAKEOUT_RISERVA: ${FOTOTIMELINE_TAKEOUT_RISERVA:-2GB}
      # "Scegli da Google Foto" (Picker API): client OAuth di Google; vuoti = funzione nascosta.
      FOTOTIMELINE_GOOGLE_CLIENT_ID: ${FOTOTIMELINE_GOOGLE_CLIENT_ID:-}
      FOTOTIMELINE_GOOGLE_CLIENT_SECRET: ${FOTOTIMELINE_GOOGLE_CLIENT_SECRET:-}
      FOTOTIMELINE_GOOGLE_CHIAVE: ${FOTOTIMELINE_GOOGLE_CHIAVE:-}
      VISIONE_URL: http://visione:8000
      VISIONE_SEGRETO: ${VISIONE_SEGRETO:?}
      # Riconoscimento dei volti (pagina "Persone"); false = spento del tutto. Soglie in DEPLOY.md.
      FOTOTIMELINE_VOLTI: ${FOTOTIMELINE_VOLTI:-true}
      FOTOTIMELINE_VOLTI_SOGLIA_GRUPPO: ${FOTOTIMELINE_VOLTI_SOGLIA_GRUPPO:-0.5}
      FOTOTIMELINE_VOLTI_SOGLIA_SICURA: ${FOTOTIMELINE_VOLTI_SOGLIA_SICURA:-0.6}
      FOTOTIMELINE_VOLTI_SOGLIA_PROPOSTA: ${FOTOTIMELINE_VOLTI_SOGLIA_PROPOSTA:-0.42}
      FOTOTIMELINE_VOLTI_LATO_MINIMO: ${FOTOTIMELINE_VOLTI_LATO_MINIMO:-32}
    # Il tetto del container: JVM (heap compreso) più ffmpeg e heif-convert. Oltre, Docker lo uccide (OOM killer).
    mem_limit: ${FOTOTIMELINE_MEMORIA_APP:-3g}
    volumes:
      # Miniature sul disco di server2: dal cloud la timeline sarebbe lenta.
      - miniature:/miniature
      # L'heap dump di un OutOfMemoryError (java_pid1.hprof): uno solo, finché non lo si cancella.
      - diagnostica:/diagnostica
      - ${FOTOTIMELINE_DATI:?}/takeout:/takeout
      # Originale (fino a 20 GB e oltre) e ricompresso di un video troppo grande: sul disco, non in /tmp del container.
      - ${FOTOTIMELINE_DATI:?}/video-grandi:/video-grandi
      - type: bind
        source: ${FOTOTIMELINE_DATI:?}/cloud
        target: /cloud
        bind:
          propagation: rslave
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/salute"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Ricerca per contenuto (CLIP multilingue) e volti (YuNet + SFace) su CPU (visione/), solo sulla rete interna.
  # I pesi dei modelli sono nell'immagine; gli indici dei vettori nel volume visione-dati (i volti in /dati/volti).
  visione:
    build:
      context: ../visione
    restart: unless-stopped
    environment:
      VISIONE_SEGRETO: ${VISIONE_SEGRETO:?}
      # Thread di torch e di OpenCV: pochi, server2 fa anche le build della CI.
      VISIONE_THREAD: ${VISIONE_THREAD:-2}
      # Con FOTOTIMELINE_VOLTI=false il modello dei volti non si carica nemmeno (~120 MB in meno).
      VISIONE_VOLTI: ${FOTOTIMELINE_VOLTI:-true}
    volumes:
      - visione-dati:/dati
    # CLIP (~0,5 GB) + il suo indice (~150 MB con 150.000 foto) + i volti (OpenCV ~120 MB, indice ~40 MB
    # ogni 100.000 volti) + i picchi del calcolo, uno alla volta: ~1,3 GB. VISIONE_MEMORIA per alzarlo.
    mem_limit: ${VISIONE_MEMORIA:-1536m}
    cpus: 2.0
    # Peso CPU basso: con le build in corso il calcolo dei vettori aspetta (e nel container gira con nice).
    cpu_shares: 256
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salute', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      FOTOTIMELINE_DOMINIO: ${FOTOTIMELINE_DOMINIO:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dati:/data
      - caddy-config:/config

volumes:
  mongo:
  miniature:
  diagnostica:
  rclone-cache:
  visione-dati:
  caddy-dati:
  caddy-config:
